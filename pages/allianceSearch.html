<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alianzas — Last War Guide</title>
  <meta name="description" content="Herramienta para Last War: Survival.">
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Last War Guide">
  <meta property="og:description" content="Herramientas para Last War: Survival.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../nav.css">
</head>
<body>

  <main class="page">

    <header class="page-hero">
      <span class="page-eyebrow">Directorio</span>
      <h1 class="page-title">Alianzas del server</h1>
      <p class="page-subtitle">Explora el ranking de alianzas de un server. Filtra por etiqueta o busca una alianza.</p>
    </header>

    <div class="card" style="margin-bottom:16px;">
      <div class="grid grid-3" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-items:end;">
        <div>
          <label class="card-muted" for="as-server">Server</label>
          <input class="input" type="number" id="as-server" value="1600" placeholder="Server">
        </div>
        <div>
          <label class="card-muted" for="as-min-power">Poder mínimo (ej: 20B)</label>
          <input class="input" type="text" id="as-min-power" placeholder="1B · 500M · 20B">
        </div>
        <div style="grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="as-btn-cargar">Cargar ranking</button>
          <input class="input" style="flex:1;min-width:180px;" id="as-filtro" placeholder="Filtrar por etiqueta...">
        </div>
      </div>
    </div>

    <div id="as-estado" class="card-muted" style="margin-bottom:12px;">Selecciona un server y carga el ranking.</div>
    <div id="as-resultados"></div>

  </main>

  <footer class="footer">
    <p>Emblemen 💪 es el mejor gocho de la alianza</p>
  </footer>

  <script type="module" src="../js/navHeader.js"></script>
  <script type="module" src="../js/modules/allianceSearchPage.js"></script>
</body>
</html>
