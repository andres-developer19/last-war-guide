# Render.com Blueprint — Despliegue de Last War Guide (Frontend + Proxy)
# Conecta este repo en Render → New → Blueprint, luego añade tu LWT_API_KEY.

services:
  - type: web
    name: last-war-guide
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: LWT_API_KEY
        sync: false
      - key: LWT_SESSION_KEY
        sync: false
      - key: NODE_VERSION
        value: 20
