<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa — Last War Guide</title>
  <meta name="description" content="Herramienta para Last War: Survival.">
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Last War Guide">
  <meta property="og:description" content="Herramientas para Last War: Survival.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../nav.css">
</head>
<body>

  <main class="page">

    <div class="session-banner" id="session-banner" style="display:none;"></div>

    <header class="page-hero">
      <span class="page-eyebrow">Mapa · Warzone</span>
      <h1 class="page-title">Explorar el mapa</h1>
      <p class="page-subtitle">Consulta un bloque del mapa por coordenadas para ver bases, zombies y jugadores.</p>
    </header>

    <div class="card" style="margin-bottom:16px;">
      <div class="grid grid-3" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));align-items:end;">
        <div>
          <label class="card-muted" for="map-x">X</label>
          <input class="input" type="number" id="map-x" value="100">
        </div>
        <div>
          <label class="card-muted" for="map-y">Y</label>
          <input class="input" type="number" id="map-y" value="100">
        </div>
        <div>
          <label class="card-muted" for="map-server">Server</label>
          <input class="input" type="number" id="map-server" value="1600">
        </div>
        <div style="grid-column:1/-1;">
          <button class="btn btn-primary btn-block" id="map-btn">Consultar bloque</button>
        </div>
      </div>
    </div>

    <div id="map-body"><div class="empty">Introduce coordenadas y consulta un bloque.</div></div>

  </main>

  <footer class="footer">
    <p>Emblemen 💪 es el mejor gocho de la alianza</p>
  </footer>

  <script type="module" src="../js/navHeader.js"></script>
  <script type="module" src="../js/modules/mapPage.js"></script>
</body>
</html>
