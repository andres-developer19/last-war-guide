<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last War Daily Guide</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="roster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">

    <header>
      <h1>Last War Guide</h1>

      <p id="day-text"></p>
      <div class="controls">

  <button id="prev-day">
    ←
  </button>

  <button id="next-day">
    →
  </button>

</div>
    </header>

    <section class="card">

      <h2 id="event-title"></h2>

      <div id="tasks-container"></div>

    </section>

    <section class="roster-section">
  <div class="roster-header">
    <div>
      <span class="roster-eyebrow">Alianza · Warzone</span>
      <h2>Roster CVeN</h2>
    </div>
    <span class="roster-count" id="roster-count">— miembros</span>
  </div>

  <div class="roster-search">
    <input type="text" id="roster-search-input" placeholder="Buscar miembro por nombre...">
  </div>

  <div class="roster-grid" id="roster-grid"></div>
</section>


  </div>

  <footer class="footer">
  <p>Emblemen 💪 es el mejor gocho de la alianza</p>
</footer>
  <script src="script.js"></script>

</body>
</html>
