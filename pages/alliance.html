<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster — Last War Guide</title>
  <meta name="description" content="Herramienta para Last War: Survival.">
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Last War Guide">
  <meta property="og:description" content="Herramientas para Last War: Survival.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/roster.css">
  <link rel="stylesheet" href="../nav.css">
</head>
<body>

  <main class="page">

    <header class="page-hero">
      <span class="page-eyebrow">Alianza · Roster</span>
      <h1 class="page-title" id="roster-title">Roster de alianza</h1>
      <p class="page-subtitle">Miembros ordenados por poder. Haz clic en un miembro para ver su detalle.</p>
    </header>

    <div class="card" style="margin-bottom:16px;">
      <div class="row-between" style="flex-wrap:wrap;gap:12px;">
        <div class="row" style="flex-wrap:wrap;gap:12px;">
          <input class="input" style="max-width:260px;" id="roster-search-input" placeholder="Buscar miembro por nombre...">
          <select class="input" id="roster-sort" style="max-width:150px;" title="Ordenar por">
            <option value="power-desc">Poder ↓</option>
            <option value="power-asc">Poder ↑</option>
            <option value="name">Nombre</option>
            <option value="rank">Rango</option>
          </select>
          <button class="btn" id="roster-apply">Ordenar</button>
        </div>
        <div class="row" style="gap:8px;">
          <span class="badge badge-accent" id="roster-count">— miembros</span>
          <a class="btn" href="allianceSearch.html">↩ Buscar otra alianza</a>
        </div>
      </div>
    </div>

    <div class="roster-grid" id="roster-grid"></div>

  </main>

  <footer class="footer">
    <p>Emblemen 💪 es el mejor gocho de la alianza</p>
  </footer>

  <script type="module" src="../js/navHeader.js"></script>
  <script type="module">
    import { cargarDatos, initBuscador } from "../js/modules/roster.js";
    cargarDatos();
    initBuscador();
  </script>
</body>
</html>
